## Dependencias (se bajan solas en el primer build a managed_components/).
##
## VERSIONES ELEGIDAS A PROPOSITO: LVGL 8.4 + esp_lvgl_port 1.x, que es la
## combinacion estable de la familia ESP32-S3 con paneles RGB. La P4 (otro
## proyecto) va con LVGL 9 y esp_lvgl_port 2.x; subir aqui a LVGL 9 es otra
## migracion de API encima del port, y con la placa sin estrenar no se suman dos
## riesgos: primero el hardware, y si luego merece la pena, se sube.
dependencies:
  idf:
    version: ">=5.4"
  lvgl/lvgl:
    version: "~8.4.0"
  espressif/esp_lvgl_port:
    version: "~1.4.0"
  # Tactil de esta placa (GT911 por I2C).
  espressif/esp_lcd_touch_gt911:
    version: "~1.0.4"
  espressif/esp_lcd_touch:
    version: "~1.1.2"
