name: build

# Compila el firmware en cada push y PR. No sustituye probar en la placa: solo
# pilla lo que no compila. Es importante en este proyecto porque el port se
# escribe en un PC (el de desarrollo) y se prueba en otro rato/PC: un error de
# compilación no lo vería nadie hasta enchufar la placa.
#
# OJO con wifi_credentials.h: NO está versionado (lleva la clave real del AP de
# la P4), así que sin el paso que lo crea desde la plantilla el build falla con
# "wifi_credentials.h: No such file or directory". Se crea solo para compilar:
# esta acción NO publica binarios (los de las Releases los compila release.sh en
# local, con la cabecera de verdad).

on:
  push:
  pull_request:

# Este job solo lee el repo; el token por defecto puede escribir.
# Las acciones van FIJADAS POR SHA, no por etiqueta (auditoria de seguridad del
# 13-oct-2026): una etiqueta la puede mover quien controle el repo de la accion
# -- o quien se haga con el -- y el runner ejecutaria ese codigo con el token
# del reposo (contents: read). Con el SHA, lo que corre es exactamente lo que se
# reviso. Para actualizar: mira el SHA de la etiqueta nueva y cambialo aqui.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # sin los tags, la version embebida sale "v?"

      - name: Crear wifi_credentials.h desde la plantilla (solo para compilar)
        run: |
          if [ -f main/wifi_credentials.h ]; then
            echo "Ya existe main/wifi_credentials.h (no deberia: no esta versionado)"
          else
            cp main/wifi_credentials.h.example main/wifi_credentials.h
            echo "[ok] creado desde la plantilla"
          fi

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: '.'
