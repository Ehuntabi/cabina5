name: build

# Compila el firmware en cada push y PR. No sustituye probar en la placa: solo
# pilla lo que no compila. Es importante en este proyecto porque el port se
# escribe en un PC (el de desarrollo) y se prueba en otro rato/PC: un error de
# compilación no lo vería nadie hasta enchufar la placa.
#
# OJO con wifi_credentials.h: NO está versionado (lleva la clave real del AP de
# la P4), así que sin el paso que lo crea desde la plantilla el build falla con
# "wifi_credentials.h: No such file or directory". Se crea solo para compilar:
# esta acción NO publica binarios (los de las Releases los compila release.sh en
# local, con la cabecera de verdad).

on:
  push:
  pull_request:

# Este job solo lee el repo; el token por defecto puede escribir.
# Las acciones van FIJADAS POR SHA, no por etiqueta (auditoria de seguridad del
# 13-oct-2026): una etiqueta la puede mover quien controle el repo de la accion
# -- o quien se haga con el -- y el runner ejecutaria ese codigo con el token
# del reposo (contents: read). Con el SHA, lo que corre es exactamente lo que se
# reviso. Para actualizar: mira el SHA de la etiqueta nueva y cambialo aqui.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # sin los tags, la version embebida sale "v?"

      - name: Crear wifi_credentials.h desde la plantilla (solo para compilar)
        run: |
          if [ -f main/wifi_credentials.h ]; then
            echo "Ya existe main/wifi_credentials.h (no deberia: no esta versionado)"
          else
            cp main/wifi_credentials.h.example main/wifi_credentials.h
            echo "[ok] creado desde la plantilla"
          fi

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: '.'

  # El contrato con la P4 (auditoria de comunicacion del 13-oct-2026): los jobs
  # de p4 ya miran esta repo, pero si el push toca SOLO cabina5 no se disparan
  # -- y este es el repo que puede romper el protocolo sin que nadie se entere
  # hasta la placa. La 3,5" se retiro el 09-nov-2026 (el dueño no la usara
  # nunca mas), asi que el unico par es la P4.
  contrato:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cabina5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cabina5

      - name: Checkout p4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Ehuntabi/p4
          path: p4

      - name: mini_proto.h igual que la P4
        run: |
          # Los dos repos se publican de uno en uno: si el de la P4 va por
          # detras se reintenta un par de veces antes de dar la alarma.
          for intento in 1 2 3 4; do
            if diff -q cabina5/main/net/mini_proto.h p4/main/net/mini_proto.h >/dev/null; then
              echo "mini_proto.h igual que la P4"
              exit 0
            fi
            if [ "$intento" = 4 ]; then break; fi
            echo "--- intento $intento: la P4 puede ir por detras; se reintenta en 45 s"
            sleep 45
            git -C p4 fetch -q origin main && git -C p4 reset -q --hard origin/main || true
          done
          diff cabina5/main/net/mini_proto.h p4/main/net/mini_proto.h || true
          echo "mini_proto.h se ha separado de la P4"
          exit 1

      - name: CUERPO_MAX del satelite, y que quepa en la P4
        run: |
          propio=$(grep -oP '#define\s+CUERPO_MAX\s+\K[0-9]+' cabina5/main/net/viaje_cola.h)
          body=$(grep -oP '#define\s+VIAJE_BODY_MAX\s+\K[0-9]+' p4/main/portal/config_server_viaje.c)
          echo "CUERPO_MAX cabina5=$propio VIAJE_BODY_MAX=$body"
          [ -n "$propio" ] && [ -n "$body" ] || exit 1
          [ "$propio" -lt "$body" ] || { echo "CUERPO_MAX no cabe en la P4"; exit 1; }

      # LOS FICHEROS DEL VIAJE YA NO SE COMPARAN CON LA 3,5": su repo quedo
      # congelado el 09-nov-2026 y portarle cada cambio no tenia sentido. Lo que
      # SI se sigue probando aqui es el comportamiento del ciclo del viaje (los
      # pasos de abajo), que es lo que de verdad importa.

      # Y la clasificacion de la que depende la garantia del cierre se PRUEBA
      # (saca la funcion real de viaje_cola.c y la compila).
      #
      # SE LANZA LA COPIA DE ESTE REPO (cabina5/test/...): los tests sacan el
      # codigo del repo que tienen al lado ($AQUI/..), asi que hay que lanzar la
      # copia de esta pantalla, no la de otro repo.
      - name: El cierre del viaje siempre cabe en la cola
        run: bash cabina5/test/viaje_cola_control.sh

      # Y el parseo del hueco de la SD de la P4 (que llega en el cuerpo de la
      # respuesta HTTP que antes se tiraba).
      - name: El hueco de la tarjeta de la P4 se entiende
        run: bash cabina5/test/viaje_cola_libre.sh

      # Y que el cambio de horario no acorte una pernocta (el epoch_local da un
      # salto atras de 3600 s: la P4 manda su desfase y la cabina corrige).
      - name: El cambio de horario no acorta las pernoctas
        run: bash cabina5/test/viaje_horario.sh

      # Y el cambio de hora de OCTUBRE, que es otro caso (B19): al atrasar el
      # reloj, el calculo de antes decia "este tramo empezo despues del cambio" y
      # no lo corregia. Se prueba la cuenta nueva con los dos cambios y la caida
      # al calculo viejo cuando no hay desfase apuntado.
      - name: El cambio de hora no deja mal los tramos abiertos
        run: bash cabina5/test/reloj_cambio_hora.sh

      # Y que los contadores del viaje (km y horas de conduccion) lleguen enteros
      # de la P4 a la cabina: van partidos en cuatro bytes sueltos del struct y
      # cruzarlos no salta a la vista (un viaje de 1200,0 km se lee como 5.739,0).
      - name: Los km y las horas de conduccion llegan enteros
        run: bash cabina5/test/viaje_contadores.sh

      # El tiempo conduciendo de la tarjeta VIAJE ("2h 35m" y "1d 2h 35m"). Va en
      # su propio fichero porque esa tarjeta SOLO existe en la 5": metido en
      # viaje_contadores.sh -- que el paso de arriba compara byte a byte entre las
      # dos cabinas -- rompe el contrato y el CI se cae (paso el 27-oct-2026).
      - name: El tiempo conduciendo se pinta con sus unidades
        run: bash cabina5/test/viaje_tiempo_card.sh

      # Y el estilo de la UI: ningun nombre de fuente sin alias (si se queda,
      # tira de la del SDK y el texto sale al tamaño literal: el fallo que se
      # colo el 16-oct-2026), ningun color a mano y los titulos centrados.
      - name: El estilo de la UI (fuentes, paleta, titulos)
        run: bash cabina5/test/estilo.sh

      # Y el minimo de brillo (21-oct-2026): se elige en Configuracion de 5 en 5
      # entre 5 y 80, y las dos decisiones que pueden salir mal (el acotado y a
      # que nivel lleva el doble toque) son puras y se prueban sacadas del fuente.
      - name: El minimo de brillo (rango y doble toque)
        run: bash cabina5/test/brillo_min.sh

      # El viaje NO se puede perder (10-nov-2026): cada apunte se guarda antes en
      # una particion de la flash y solo sale cuando la P4 confirma su id. Este
      # test compila el modulo de produccion con flash simulada y prueba
      # reinicio, corte a mitad de escritura y compactacion interrumpida.
      - name: Diario del viaje (copia duradera en la flash)
        run: bash cabina5/test/viaje_diario.sh

      # Y las decisiones de la actualizacion OTA (comparacion de versiones y
      # sha256): se sacan del ota_rx.c real y se compilan en el runner. Un error
      # aqui deja la pantalla con un firmware que no arranca.
      - name: La actualizacion OTA decide bien (version y sha256)
        run: bash cabina5/test/ota_version.sh

      - name: El contrato del canal de viaje, contra la P4
        run: bash p4/test/protocolo_cabina.sh p4 cabina5

      # ── GUARDAS DE LOS SCRIPTS DE PUBLICAR Y GRABAR (16-oct-2026) ──────────
      # El CI no graba ni publica (no hay placas ni secretos) y eso NO cambia: el
      # .bin de la Release lo compila release.sh EN LOCAL, con la cabecera REAL
      # del AP, mientras que este workflow compila con la PLANTILLA ("CAMBIAME").
      # O sea que "lo compila el CI, luego esta bien" es falso justo para el .bin
      # que se descarga. Lo que SI puede hacer el CI es vigilar que los scripts
      # que graban y publican conserven sus comprobaciones: la auditoria del
      # 16-oct encontro a la 3,5" sin el guard de wifi_credentials.h y a las dos
      # con la comprobacion del .bin metida en el "else" de "la Release ya
      # existe" (una Release sin asset acababa en "PUBLICADO" y exit 0). Que se
      # caiga aqui es barato; que se caiga con la placa delante, no.
      - name: El CI no publica, y release.sh no publica la clave de broma
        run: |
          for repo in cabina5; do
            if git -C "$repo" ls-files --error-unmatch main/wifi_credentials.h >/dev/null 2>&1; then
              echo "$repo: main/wifi_credentials.h esta VERSIONADO (lleva la clave real del AP)"; exit 1
            fi
            grep -q 'wifi_credentials.h' "$repo/release.sh" \
              || { echo "$repo: release.sh no comprueba la clave del AP"; exit 1; }
          done
          echo "el CI no publica binarios; release.sh exige la clave real antes de publicar"

      - name: Los guardas de grabar/publicar siguen en su sitio (las dos cabinas)
        run: |
          fallo=0
          for repo in cabina5; do
            g="$repo/scripts/grabar.sh"; r="$repo/release.sh"
            for f in "$g" "$r"; do [ -f "$f" ] || { echo "FALTA $f"; fallo=1; }; done
            for frase in 'git describe --tags --exact-match' 'git ls-remote origin' \
                         'gh release download' 'sha256sum' 'chip_id' 'write_flash' \
                         'xtensa-esp32s3-elf-gcc' 'components' 'partitions.csv' \
                         'git checkout -- sdkconfig'; do
              grep -qF -- "$frase" "$g" || { echo "$g: le falta '$frase'"; fallo=1; }
            done
            for frase in 'wifi_credentials.h' 'sha256sum' 'gh release upload' \
                         'grep -qxF "$ASSET"' 'git checkout -- sdkconfig'; do
              grep -qF -- "$frase" "$r" || { echo "$r: le falta '$frase'"; fallo=1; }
            done
            if grep -qE '^[[:space:]]*idf\.py +-p.*flash' "$g" "$r"; then
              echo "$repo: ha vuelto 'idf.py flash' a los scripts (es el camino sin comprobaciones)"; fallo=1
            fi
          done
          [ "$fallo" = 0 ] || { echo "Se han perdido guardas en los scripts de grabar/publicar"; exit 1; }
          echo "guardas presentes en las dos cabinas"

      - name: El esquema de alias de fuentes (alias -> fuente DEL PROYECTO)
        run: |
          # Los nombres viejos del SDK tienen que apuntar a una fuente del
          # proyecto (lv_font_inter_*_es) o a un papel (FUENTE_*), nunca a otra
          # del SDK ni a un nombre inventado: si apuntan mal, el texto sale con
          # la fuente del SDK (tamaño literal) y no falla al compilar.
          fallo=0
          for repo in cabina5; do
            malos=$(grep -rhE '^#define +lv_font_montserrat_(bold_)?[0-9]+ +' "$repo/main" --include=*.h \
                    | awk '{print $3}' | grep -vE '^(lv_font_inter_[a-z0-9_]*|FUENTE_[A-Z_]+)$' || true)
            [ -z "$malos" ] || { echo "$repo: alias que NO apuntan a una fuente del proyecto: $malos"; fallo=1; }
          done
          [ "$fallo" = 0 ] || exit 1
          echo "los alias de las dos cabinas apuntan a fuentes del proyecto"

      - name: La captura de panicos esta versionada (nada de /tmp/cap2.py)
        run: |
          for repo in cabina5; do
            test -f "$repo/scripts/cap2.py" || { echo "$repo: falta scripts/cap2.py"; exit 1; }
            grep -q 'AQUI/cap2.py' "$repo/scripts/vigilar_panicos.sh" \
              || { echo "$repo: vigilar_panicos.sh no usa scripts/cap2.py"; exit 1; }
            if grep -q '/tmp/cap2.py' "$repo/scripts/vigilar_panicos.sh"; then
              echo "$repo: vigilar_panicos.sh sigue llamando a /tmp/cap2.py"; exit 1
            fi
          done
          echo "la captura del serial esta en el repo"

      - name: shellcheck de los scripts propios
        run: |
          shellcheck -S warning \
            cabina5/scripts/grabar.sh cabina5/scripts/vigilar_panicos.sh cabina5/release.sh \
            cabina5/test/estilo.sh
